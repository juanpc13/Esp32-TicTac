; PlatformIO Project Configuration File
;
; Esp32-TicTac
;
; Cuatro entornos: dos placas x dos formas de subir.
;
;   s2-ota      ESP32-S2 por WiFi  -> tictac-s2.local      (el normal)
;   s2-usb      ESP32-S2 por cable. Solo rescate, ver nota abajo.
;   esp32-ota   ESP32 clasico por WiFi -> tictac-esp32.local
;   esp32-usb   ESP32 clasico por cable. Primera carga.
;
; Los pines cambian solos segun la placa: main.cpp usa
; CONFIG_IDF_TARGET_ESP32S2, que define el core.
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = s2-ota

; ---- Comun a todos los entornos ----
[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.3
    mathertel/OneButton@^2.6.2
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9

; ---- Perfil por placa ----
[placa_s2]
board = esp32-s2-saola-1
; CDC_ON_BOOT=0 a proposito: la OLED vive en GPIO19/20, que en el S2
; son D-/D+ del USB nativo. Con el CDC activo el PHY USB se queda con
; esos pines y el I2C no arranca. Consecuencias:
;   - El monitor serie sale por el puerto UART de la placa (CP2102N),
;     no por el conector USB del chip.
;   - Las subidas son por OTA (env s2-ota).
;   - Rescate: BOOT+RESET entra en modo descarga de la ROM y el env
;     s2-usb vuelve a grabar por cable aunque el CDC este apagado.
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=0

[placa_clasica]
board = esp32dev
build_flags =
    -DCORE_DEBUG_LEVEL=1

; ---- Perfil de subida por aire ----
; --host_port fijo: Windows reserva rangos de puertos al azar y
; espota falla con "Listen Failed" si cae dentro de uno. Ver
; netsh interface ipv4 show excludedportrange protocol=tcp
[subida_ota]
upload_protocol = espota
upload_flags =
    --port=3232
    --host_port=45678

; ====================== ENTORNOS =============================

[env:s2-usb]
extends = placa_s2
upload_protocol = esptool

[env:s2-ota]
extends = placa_s2, subida_ota
upload_port = tictac-s2.local

[env:esp32-usb]
extends = placa_clasica
upload_protocol = esptool

[env:esp32-ota]
extends = placa_clasica, subida_ota
upload_port = tictac-esp32.local
