; PlatformIO Project Configuration File
;
; Esp32-TicTac
;
; Cuatro entornos: dos placas x dos formas de subir.
;
;   s2-usb      ESP32-S2 por cable (USB nativo). Primera carga.
;   s2-ota      ESP32-S2 por WiFi  -> tictac-s2.local
;   esp32-usb   ESP32 clasico por cable. Primera carga.
;   esp32-ota   ESP32 clasico por WiFi -> tictac-esp32.local
;
; Los pines cambian solos segun la placa: main.cpp usa
; CONFIG_IDF_TARGET_ESP32S2, que define el core.
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = s2-usb

; ---- Comun a todos los entornos ----
[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.3
    mathertel/OneButton@^2.6.2

; ---- Perfil por placa ----
[placa_s2]
board = esp32-s2-saola-1
; CDC_ON_BOOT: Serial sale por el USB nativo, y deja que esptool
; entre en modo descarga por software (sin BOOT+RESET a mano)
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[placa_clasica]
board = esp32dev
build_flags =
    -DCORE_DEBUG_LEVEL=1

; ---- Perfil de subida por aire ----
; --host_port fijo: Windows reserva rangos de puertos al azar y
; espota falla con "Listen Failed" si cae dentro de uno. Ver
; netsh interface ipv4 show excludedportrange protocol=tcp
[subida_ota]
upload_protocol = espota
upload_flags =
    --port=3232
    --host_port=45678

; ====================== ENTORNOS =============================

[env:s2-usb]
extends = placa_s2
upload_protocol = esptool

[env:s2-ota]
extends = placa_s2, subida_ota
upload_port = tictac-s2.local

[env:esp32-usb]
extends = placa_clasica
upload_protocol = esptool

[env:esp32-ota]
extends = placa_clasica, subida_ota
upload_port = tictac-esp32.local
